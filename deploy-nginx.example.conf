# Nginx örneği — server {} bloğu içine uyarlayın.
# Bu "kolay kurulum" paketi için web root doğrudan paket klasörüdür.
root /path/to/iyilik-mutfagi-canli-v5-kolay-kurulum;
index index.php;

location = /robots.txt { try_files $uri /robots.php?$query_string; }
location = /sitemap.xml { try_files $uri /sitemap.php?$query_string; }
location / { try_files $uri $uri/ /index.php?$query_string; }

# Özel uygulama dosyalarını dışarı kapat.
location ~ ^/(?:app|bin|database|storage)(?:/|$) { deny all; }
location ~ ^/(?:config(?:\.example)?\.php|.*\.(?:sql|md)|deploy-nginx\.example\.conf)$ { deny all; }

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
}
